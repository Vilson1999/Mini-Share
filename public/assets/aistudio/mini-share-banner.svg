<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.52" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="28" fill="url(#bg)"/>

  <!-- Updated app icon -->
  <g transform="translate(58 38)">
    <rect width="144" height="144" rx="28" fill="#c9e8ff"/>

    <!-- Left phone -->
    <g transform="rotate(-7 72 72)">
      <rect x="22" y="24" width="51" height="75" rx="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="7"/>
      <rect x="31" y="34" width="33" height="38" rx="3" fill="url(#blue)"/>
      <rect x="31" y="77" width="33" height="14" rx="3" fill="#163f91" opacity="0.9"/>
    </g>

    <!-- Right phone -->
    <g transform="rotate(7 72 72)">
      <rect x="71" y="24" width="51" height="75" rx="10" fill="#047857" stroke="#10b981" stroke-width="7"/>
      <rect x="80" y="34" width="33" height="38" rx="3" fill="url(#teal)"/>
      <rect x="80" y="77" width="33" height="14" rx="3" fill="#176b61" opacity="0.9"/>
    </g>

    <!-- Curved red transfer/smile arrow -->
    <path d="M27 105 C35 132 58 146 72 146 C94 146 113 133 121 108" fill="none" stroke="#b91c1c" stroke-width="18" stroke-linecap="round"/>
    <path d="M20 96 L42 106 L26 119 Z" fill="#7f1d1d" stroke="#1e293b" stroke-width="2"/>
    <path d="M128 99 L106 111 L124 122 Z" fill="#7f1d1d" stroke="#1e293b" stroke-width="2"/>
  </g>

  <text x="238" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700">Mini Share</text>
</svg>
